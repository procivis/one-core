app:
  insecureVcApiEndpointsEnabled: true
  hideErrorResponseCause: false

walletProvider:
  PROCIVIS_ONE:
    params:
      public:
        walletName: "Procivis One Test Wallet"
        integrityCheck:
          android:
            bundleId: ch.procivis.one.wallet.test
            signingCertificateFingerprints: [
                "3C:54:08:A0:AB:59:9A:5B:51:72:3F:DA:58:8E:81:DB:4F:A0:65:41:0E:7D:C2:65:4D:F1:A5:67:5B:47:13:52", # bitrise
                "5D:EC:CA:A1:30:25:AA:5A:D7:6F:3D:DE:5D:16:04:66:45:20:DE:B9:A7:FF:BB:69:1B:43:07:57:48:E8:30:81", # google-play
              ]
          ios:
            bundleId: AGG3V6QN4G.ch.procivis.one.wallet.test
            enforceProductionBuild: false
        appVersion:
          minimum: "v1.50.0"
        eudiWalletInfo:
          providerName: "Procivis One Test"
        featureFlags:
          ecosystemsEnabled: true
          refreshCredentialBatchEnabled: true
          documentSigningEnabled: true
          ecosystemsEnforcementEnabled: false
          dcApiIntegrationEnabled: true
        documentSigners:
          - SIGN8
verifierProvider:
  PROCIVIS_ONE:
    params:
      public:
        verifierName: "Procivis One Test Verifier"
        integrityCheck:
          android:
            bundleId: ch.procivis.one.verifier.test
            signingCertificateFingerprints: [
                "3C:54:08:A0:AB:59:9A:5B:51:72:3F:DA:58:8E:81:DB:4F:A0:65:41:0E:7D:C2:65:4D:F1:A5:67:5B:47:13:52", # bitrise
                "7A:7F:0A:B5:13:4F:07:9E:5A:66:E1:F9:BB:C2:21:58:F8:66:88:9E:7E:00:0E:27:47:12:42:55:84:6E:11:CA", # google-play
              ]
          ios:
            bundleId: AGG3V6QN4G.ch.procivis.one.verifier.test
            enforceProductionBuild: false
        featureFlags:
          ecosystemsEnabled: true
          ecosystemsEnforcementEnabled: false
format:
  MDOC_SHORT_EXPIRY:
    type: "MDOC"
    display:
      en: "ISO mdoc (short expiry)"
      de: "ISO mdoc (kurze Gültigkeit)"
    order: 101
    params:
      public:
        expirationSeconds: 60
        msoExpectedUpdateInSeconds: 60
        msoMinimumRefreshSeconds: 10
        leewaySeconds: 10
        revocationMethod: "MDOC_TOKENSTATUSLIST"
transport:
  MQTT:
    type: "MQTT"
    display: "transport.mqtt"
    enabled: true
    order: 1
    params:
      private:
        brokerUrl: "mqtts://mqtt.dev.procivis-one.com:8883"
verificationProtocol:
  OPENID4VP_PROXIMITY_DRAFT00:
    display:
      en: "OpenID4VP Proximity"
      de: "OpenID4VP Nahbereich"
    order: 5
    type: "OPENID4VP_PROXIMITY_DRAFT00"
    params:
      public:
        verifier:
          interactionExpiresInSeconds: 3600
signer:
  REGISTRATION_CERTIFICATE:
    params:
      private:
        payload:
          issuer: "https://core.test.procivis-one"
