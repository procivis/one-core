verificationProtocol:
  OPENID4VP_FINAL1_SWIYU:
    display:
      en: "OpenID4VP final 1.0 (SWIYU)"
      de: "OpenID4VP final 1.0 (SWIYU)"
    order: 3
    type: "OPENID4VP_FINAL1_SWIYU"
    params:
      public:
        webhookTask: "WEBHOOK_NOTIFY"
        redirectUri:
          enabled: true
          allowedSchemes: ["https"]
        verifier:
          interactionExpiresInSeconds: 3600
  OPENID4VP_FINAL1:
    display: "exchange.openid4vpFinal1"
    order: 20
    type: "OPENID4VP_FINAL1"
    params:
      public:
        webhookTask: "WEBHOOK_NOTIFY"
        useRequestUri: true
        urlScheme: openid4vp
        verifier:
          interactionExpiresInSeconds: 3600
          supportedClientIdSchemes:
            [
              verifier_attestation,
              redirect_uri,
              decentralized_identifier,
              x509_hash,
              x509_san_dns,
            ]
        holder:
          supportedClientIdSchemes:
            [
              verifier_attestation,
              redirect_uri,
              decentralized_identifier,
              x509_hash,
              x509_san_dns,
            ]
        redirectUri:
          enabled: true
          allowedSchemes: ["https"]
  OPENID4VP_FINAL1_HAIP:
    display:
      en: "OpenID4VP final 1.0 (HAIP)"
      de: "OpenID4VP final 1.0 (HAIP)"
    order: 21
    type: "OPENID4VP_FINAL1"
    params:
      public:
        webhookTask: "WEBHOOK_NOTIFY"
        useRequestUri: true
        urlScheme: haip-vp
        verifier:
          interactionExpiresInSeconds: 3600
          supportedClientIdSchemes: [x509_hash]
        holder:
          supportedClientIdSchemes: [x509_hash]
        redirectUri:
          enabled: true
          allowedSchemes: ["https"]
