[package]
authors                = ["Procivis"]
build                  = "build.rs"
edition.workspace      = true
license                = "Apache-2.0"
name                   = "one-core"
publish                = false
rust-version.workspace = true
version                = "0.1.0"

[dependencies]
aes-gcm                      = { workspace = true, features = ["std"] }
anyhow.workspace             = true
asn1-rs.workspace            = true
async-trait.workspace        = true
bincode                      = { version = "1.3" }
bit-vec                      = { version = "0.10", default-features = false }
bon.workspace                = true
bs58.workspace               = true
ciborium.workspace           = true
convert_case                 = { version = "0.10" }
coset                        = { version = "0.4", features = ["std"] }
crc                          = { version = "3.3" }
ct-codecs.workspace          = true
dashmap                      = "6.1.0"
figment                      = { version = "0.10", default-features = false }
flate2.workspace             = true
futures.workspace            = true
futures-util.workspace       = true
hex.workspace                = true
hex-literal.workspace        = true
hkdf                         = { version = "0.13" }
human-sort                   = { version = "0.2" }
indexmap.workspace           = true
indoc.workspace              = true
itertools.workspace          = true
json-ld                      = { version = "0.21" }
json-syntax                  = { version = "0.12", features = ["serde", "serde_json"] }
ldapdn                       = { version = "1" }
maplit.workspace             = true
mime.workspace               = true
mockall                      = { workspace = true, optional = true }
multihash.workspace          = true
ndef-rs                      = { version = "0.2" }
num-traits                   = "0.2"
one-crypto.workspace         = true
one-dto-mapper.workspace     = true
pem                          = { version = "4" }
proc-macros.workspace        = true
quick-xml.workspace          = true
rcgen.workspace              = true
regex.workspace              = true
reqwest                      = { workspace = true, features = ["stream"] }
roxmltree.workspace          = true
rumqttc-next                 = { version = "0.27", default-features = false, features = ["use-rustls"] }
rustls                       = { version = "0.23", default-features = false, features = ["aws_lc_rs"] }
rustls-pki-types             = { version = "1.14" }
rustls-platform-verifier     = { workspace = true }
secrecy                      = { workspace = true }
serde.workspace              = true
serde_json.workspace         = true
serde_json_path.workspace    = true
serde_qs.workspace           = true
serde_repr                   = { version = "0.1" }
serde_urlencoded.workspace   = true
serde_with.workspace         = true
serde_yaml                   = { version = "0.9" }
sha2.workspace               = true
shadow-rs.workspace          = true
shared-types.workspace       = true
sophia_api                   = { version = "0.9" }
sophia_c14n                  = { version = "0.9" }
standardized-types.workspace = true
strum.workspace              = true
tempfile.workspace           = true
thiserror.workspace          = true
time.workspace               = true
tokio                        = { workspace = true, features = ["macros"] }
tokio-util                   = { version = "0.7", features = ["rt"] }
tracing.workspace            = true
url.workspace                = true
urlencoding.workspace        = true
uuid                         = { workspace = true, features = ["serde"] }
x509-parser.workspace        = true
yasna                        = { version = "0.6" }
zip                          = { version = "7.0", default-features = false, features = ["lzma", "deflate"] }

[dev-dependencies]
assert2.workspace         = true
mockall.workspace         = true
one-crypto                = { workspace = true, features = ["mock"] }
rstest.workspace          = true
rusty-fork                = { version = "0.3" }
similar-asserts.workspace = true
tokio                     = { workspace = true, features = ["rt-multi-thread", "macros"] }
wiremock.workspace        = true

[build-dependencies]
shadow-rs.workspace = true

[features]
config_env  = ["figment/env"]
config_json = ["figment/json"]
config_yaml = ["figment/yaml"]
default     = ["config_yaml"]
mock        = ["mockall", "one-crypto/mock"]

[lints]
workspace = true
