[package]
authors                = ["Procivis"]
edition.workspace      = true
license                = "Apache-2.0"
name                   = "one-crypto"
publish                = false
rust-version.workspace = true
version                = "0.1.0"

[lib]
doctest = false

[dependencies]
aes                          = { version = "0.8.4" }
aes-gcm                      = { workspace = true, features = ["rand_core", "zeroize"] }
async-trait.workspace        = true
blstrs                       = { version = "0.7" }
cbc                          = { version = "0.1.2" }
chacha20poly1305             = { version = "0.10" }
cocoon                       = { version = "0.5" }
concat-kdf                   = { version = "0.1" }
ct-codecs.workspace          = true
ed25519-compact              = { version = "2.4", default-features = false, features = ["pem", "std", "x25519"] }
flate2.workspace             = true
hmac                         = { version = "0.13" }
ml-dsa                       = { version = "0.1", default-features = false, features = ["rand_core", "zeroize"] }
mockall                      = { workspace = true, optional = true }
p256                         = { version = "0.14", features = ["ecdh"] }
pbkdf2                       = { version = "0.13" }
secrecy.workspace            = true
serde.workspace              = true
serde_json.workspace         = true
sha1                         = { version = "0.10" }
sha2.workspace               = true
standardized-types.workspace = true
thiserror.workspace          = true

# pairing_crypto is fixed to this specific commit, so the implementation of BBS+ is still the draft-06 version
pairing_crypto = { version = "0.4.3", git = "https://github.com/procivis/pairing_crypto", rev = "0ec3629" }

# TODO (ONE-8329): should be unified
rand        = { workspace = true }
rand_chacha = { version = "0.10.0" }
rand_old    = { package = "rand", version = "0.8.5" }
sha2_v10    = { package = "sha2", version = "0.10" }

[dev-dependencies]
hex.workspace             = true
hex-literal.workspace     = true
mockall.workspace         = true
similar-asserts.workspace = true
tokio                     = { workspace = true, features = ["rt-multi-thread", "macros"] }

[features]
mock = ["mockall"]

[lints]
workspace = true
