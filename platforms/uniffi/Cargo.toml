[package]
authors           = ["Procivis"]
edition.workspace = true
license           = "Apache-2.0"
name              = "one-core-uniffi"
publish           = false
version           = "0.1.0"

[lib]
crate-type = ["cdylib", "staticlib"]

[features]
# Treat build warnings as error
strict = []

[dependencies]
async-trait.workspace        = true
ct-codecs.workspace          = true
one-core                     = { workspace = true, features = ["config_json"] }
one-crypto.workspace         = true
one-dto-mapper.workspace     = true
rustls-platform-verifier     = { workspace = true }
secrecy.workspace            = true
serde.workspace              = true
serde_json.workspace         = true
shared-types.workspace       = true
sql-data-provider.workspace  = true
standardized-types.workspace = true
strum.workspace              = true
thiserror.workspace          = true
time.workspace               = true
tokio                        = { workspace = true, features = ['rt-multi-thread'] }
tracing                      = { workspace = true }
tracing-subscriber           = { workspace = true }
uniffi                       = { workspace = true, features = ["tokio"] }
url.workspace                = true
uuid.workspace               = true

[dev-dependencies]
mockall.workspace         = true
similar-asserts.workspace = true

[target.'cfg(target_os = "android")'.dependencies]
jni             = { version = "0.21" }
tracing-android = { version = "0.2" }

[target.'cfg(target_os = "ios")'.dependencies]
tracing-oslog = { version = "0.3.0" }

[lints]
workspace = true
