[bindings.kotlin]
android               = true
cdylib_name           = "procivis_one_core"
kotlin_target_version = "2.0"
package_name          = "ch.procivis.one.core"

[bindings.swift]
generate_case_iterable_conformance = true
generate_codable_conformance       = true
module_name                        = "ProcivisOneCore"

# Typescript interface (generated by uniffi-bindgen-ts-interface)
[bindings.ts-interface]
hidden_types = [
    # only visible in the native layer
    "InitParams",

    "NativeKeyStorage",
    "GeneratedKey",
    "NativeKeyStorageError",

    "BleCentral",
    "BlePeripheral",
    "BleError",
    "CharacteristicPermission",
    "CharacteristicProperty",
    "CharacteristicSettings",
    "CharacteristicWriteType",
    "ConnectionEvent",
    "DeviceInfo",
    "PeripheralDiscoveryData",
    "ServiceDescription",

    "NfcHce",
    "NfcHceHandler",
    "NfcScanner",
    "NfcError",

    "CredentialManager",
    "CredentialManagerError",
    "DigitalCredentialRegistration",
    "DigitalCredentialClaim",
    "DigitalCredentialDisplay",
    "DigitalCredentialMetadata",
    "DcApiResponseHandler",
]

[bindings.ts-interface.hidden_enum_variants]
HandleInvitationRequestData = ["Iso18013DcApi", "OpenID4vpDcApi"]

[bindings.ts-interface.type_overrides]
OptionalString = "string | null /* pass null to clear the value */"
