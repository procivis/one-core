import org.jetbrains.kotlin.gradle.dsl.KotlinVersion

plugins {
    id 'com.android.library'
    id 'org.jetbrains.dokka'
}

android {
    namespace 'ch.procivis.one.core'
    compileSdk 35

    defaultConfig {
        minSdk 22
        targetSdk 33

        consumerProguardFiles 'proguard-lib.pro'
    }

    buildTypes {
        release {
            minifyEnabled true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-build.pro', 'proguard-lib.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}

kotlin {
    compilerOptions {
        languageVersion = KotlinVersion.fromVersion('2.0')
        apiVersion = KotlinVersion.fromVersion('2.0')
    }
}

dependencies {
    implementation "androidx.credentials.registry:registry-digitalcredentials-mdoc:1.0.0-alpha05"
    implementation "androidx.credentials.registry:registry-digitalcredentials-openid:1.0.0-alpha05"
    implementation "androidx.credentials.registry:registry-digitalcredentials-sdjwtvc:1.0.0-alpha05"
    implementation "androidx.credentials.registry:registry-provider:1.0.0-alpha05"
    implementation "androidx.credentials.registry:registry-provider-play-services:1.0.0-alpha05"
    implementation "androidx.core:core-ktx:1.16.0"

    implementation 'net.java.dev.jna:jna:5.17.0'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.8.1'
    implementation 'androidx.annotation:annotation:1.8.0'
    implementation 'org.greenrobot:eventbus:3.3.1'
    dokkaPlugin 'org.jetbrains.dokka:android-documentation-plugin:2.2.0'
}

dokka {
    dokkaPublications.html {
        suppressInheritedMembers.set(true)
    }
}
